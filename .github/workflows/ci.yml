name: CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check (Oxlint)
        run: npm run lint

      - name: 🏗️ Build production bundle (Vite)
        run: npm run build

      - name: 🎭 Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: 🧪 Execute Playwright End-to-End Test Suite
        run: npx playwright test
        env:
          CI: true

      - name: 📊 Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-verification:
    name: Production Deployment Verification
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Verify Production Vercel Deployment Health
        run: |
          echo "Circlo CI/CD: Automated tests passed cleanly."
          echo "Vercel auto-deploy tracks branch 'main'."
          echo "Target deployment URL: https://circlo-eight.vercel.app/"
