version: '3.8'

# ==============================================================================
# CIRCLO LOCAL INFRASTRUCTURE (Build It Track)
# Run 100% locally with zero cloud costs using LocalStack & OpenSearch
# ==============================================================================

services:
  # LocalStack: Emulates AWS S3, Lambda, DynamoDB, EventBridge, SNS, SQS locally
  localstack:
    container_name: circlo-localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=s3,lambda,dynamodb,sns,sqs,eventbridge
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=ap-south-1
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - circlo-net

  # AWS OpenSearch: Open source search and geospatial analytics engine
  opensearch:
    container_name: circlo-opensearch
    image: opensearchproject/opensearch:2.11.1
    environment:
      - cluster.name=circlo-cluster
      - node.name=circlo-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true  # For local frictionless hackathon dev
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200" # REST API & Geo queries
      - "9600:9600" # Performance analyzer
    networks:
      - circlo-net

  # OpenSearch Dashboards (Optional UI)
  opensearch-dashboards:
    container_name: circlo-dashboards
    image: opensearchproject/opensearch-dashboards:2.11.1
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    networks:
      - circlo-net

networks:
  circlo-net:
    driver: bridge
